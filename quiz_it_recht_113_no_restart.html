<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IT-Recht Quiz — 113 Question PDF Set</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg2: #12183a;
      --card: rgba(16, 23, 52, 0.92);
      --card-strong: #101734;
      --text: #f5f7ff;
      --muted: #b8c0ff;
      --muted2: #d8dcff;
      --accent: #6d4aff;
      --accent2: #360094;
      --danger: #ff5c7a;
      --ok: #40e2a0;
      --warning: #ffd166;
      --border: rgba(255,255,255,.20);
      --border-strong: rgba(255,255,255,.34);
      --shadow: 0 24px 70px rgba(0,0,0,.42), 0 4px 18px rgba(0,0,0,.25);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background:
        radial-gradient(circle at 18% 10%, rgba(109,74,255,.34), transparent 30rem),
        radial-gradient(circle at 85% 15%, rgba(64,226,160,.14), transparent 26rem),
        linear-gradient(145deg, var(--bg), #070a16 70%);
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(16px, 3vw, 36px);
    }

    .shell {
      width: min(100%, 1180px);
      display: grid;
      gap: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(16, 23, 52, .60);
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 22px rgba(0,0,0,.18);
    }

    .brand { display: grid; gap: 2px; }
    .brand h1 { margin: 0; font-size: clamp(1.1rem, 2vw, 1.55rem); letter-spacing: -.02em; }
    .brand p { margin: 0; color: var(--muted); font-size: .92rem; }

    .pills { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--border);
      color: var(--muted2);
      font-size: .88rem;
      white-space: nowrap;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 16px var(--accent); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(18px, 3vw, 28px);
      overflow: hidden;
      backdrop-filter: blur(14px);
    }

    .progress-wrap { display: grid; gap: 9px; margin-bottom: 18px; }
    .status-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: .92rem;
      flex-wrap: wrap;
    }
    .progress {
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
    }
    .progress > span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent2), var(--accent), var(--ok));
      transition: width .28s ease;
    }

    fieldset { border: 0; padding: 0; margin: 0; }
    #question {
      display: block;
      width: 100%;
      font-size: clamp(1.18rem, 2.4vw, 1.65rem);
      line-height: 1.35;
      margin: 6px 0 18px 0;
      font-weight: 750;
      text-align: center;
      letter-spacing: -.015em;
    }

    .hint {
      margin: -6px auto 18px;
      color: var(--muted);
      text-align: center;
      font-size: .92rem;
    }

    .choices {
      display: grid;
      gap: 12px;
    }

    .choice input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .choice label {
      display: grid;
      grid-template-columns: 34px 1fr;
      align-items: start;
      gap: 13px;
      padding: 15px 16px;
      background: rgba(255,255,255,0.075);
      border: 2px solid var(--border);
      border-radius: 16px;
      cursor: pointer;
      transition: transform .10s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
      min-height: 62px;
    }
    .choice label:hover {
      transform: translateY(-2px);
      border-color: var(--border-strong);
      box-shadow: 0 10px 18px rgba(0,0,0,.20);
      background: rgba(255,255,255,0.10);
    }
    .choice input[type="checkbox"]:focus-visible + label { outline: 3px solid rgba(109,74,255,.45); outline-offset: 3px; }
    .choice.selected label {
      border-color: var(--accent);
      background: rgba(109,74,255,0.22);
    }
    .choice .badge {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: .9rem;
      font-weight: 800;
      background: rgba(184,192,255,.22);
      color: #fff;
      border: 1px solid rgba(255,255,255,.18);
      line-height: 1;
    }
    .choice .text { line-height: 1.42; padding-top: 5px; }
    .choice.correct label {
      border-color: rgba(64,226,160,.9);
      background: rgba(64,226,160,0.22);
      color: #fff;
    }
    .choice.correct .badge { background: rgba(64,226,160,.96); color: #07120f; }
    .choice.incorrect label {
      border-color: rgba(255,92,122,.95);
      background: rgba(255,92,122,0.22);
      color: #fff;
    }
    .choice.incorrect .badge { background: rgba(255,92,122,.96); color: #fff; }
    .choice.missed label {
      border-color: rgba(255,209,102,.95);
      box-shadow: inset 0 0 0 1px rgba(255,209,102,.35);
    }

    .feedback {
      margin-top: 16px;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      color: var(--muted2);
      background: rgba(255,255,255,.06);
      display: none;
    }
    .feedback.show { display: block; }
    .feedback.ok { border-color: rgba(64,226,160,.55); background: rgba(64,226,160,.12); }
    .feedback.bad { border-color: rgba(255,92,122,.60); background: rgba(255,92,122,.10); }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }
    .btn {
      appearance: none;
      border: 1px solid transparent;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      color: #fff;
      font-weight: 750;
      padding: 12px 18px;
      border-radius: 14px;
      cursor: pointer;
      min-width: 140px;
      transition: transform .10s ease, opacity .16s ease, box-shadow .16s ease, border-color .16s ease;
      box-shadow: 0 10px 20px rgba(54,0,148,.25);
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(54,0,148,.32); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn.secondary { background: rgba(184,192,255,.16); color: var(--text); border-color: var(--border); box-shadow: none; }
    .btn.success { background: rgba(64,226,160,.23); border-color: rgba(64,226,160,.55); box-shadow: none; }
    .btn.danger { background: rgba(255,92,122,.18); border-color: rgba(255,92,122,.48); box-shadow: none; }

    .results { text-align: center; display: grid; gap: 16px; }
    .score-big { font-size: clamp(2.2rem, 6vw, 4.2rem); font-weight: 850; letter-spacing: -.06em; }
    .result-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
    .metric {
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
    }
    .metric strong { display: block; font-size: 1.35rem; }
    .metric span { color: var(--muted); font-size: .9rem; }
    .missed-list {
      text-align: left;
      max-height: 280px;
      overflow: auto;
      display: grid;
      gap: 8px;
      padding: 4px;
    }
    .missed-item {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      border-radius: 14px;
      padding: 10px 12px;
      color: var(--muted2);
    }
    .missed-item b { color: var(--text); }

    .toolbar {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .mini {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 10px;
      cursor: pointer;
    }
    .mini:hover { color: var(--text); border-color: var(--border-strong); }

    .kbd {
      display: inline-grid;
      place-items: center;
      min-width: 1.65em;
      padding: 1px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,.22);
      color: var(--muted2);
      background: rgba(255,255,255,.08);
      font-size: .82em;
    }

    @media (max-width: 720px) {
      .topbar { align-items: stretch; }
      .pills { justify-content: flex-start; }
      .result-grid { grid-template-columns: 1fr; }
      .btn { width: 100%; }
      .choice label { grid-template-columns: 30px 1fr; padding: 14px; }
      .choice .badge { width: 30px; height: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="shell" aria-label="IT-Recht quiz app">
      <div class="topbar">
        <div class="brand">
          <h1>IT-Recht Quiz</h1>
          <p>Only using the <strong>113-question IT-Recht PDF</strong> question set</p>
        </div>
        <div class="pills" aria-label="Quiz stats">
          <span class="pill"><span class="dot"></span><span id="sourcePill">113-question PDF set</span></span>
          <span class="pill">Score: <strong id="scorePill">0</strong></span>
          <span class="pill">Missed: <strong id="missedPill">0</strong></span>
        </div>
      </div>

      <div class="card" role="region" aria-labelledby="question">
        <div class="progress-wrap">
          <div class="status-row">
            <span id="status">Loading…</span>
            <span id="shortcutHint"><span class="kbd">1-9</span> select · <span class="kbd">Enter</span> check/next</span>
          </div>
          <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
        </div>

        <form id="quizForm">
          <fieldset>
            <legend id="question">Loading…</legend>
            <div class="hint" id="hint">Select all correct answers.</div>
            <div id="choices" class="choices" role="group" aria-labelledby="question"></div>
          </fieldset>
          <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
          <div class="actions">
            <button type="button" id="checkBtn" class="btn" disabled>Check answers</button>
            <button type="button" id="nextBtn" class="btn secondary" hidden>Next</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script>
    const SOURCE_QUESTIONS = JSON.parse(document.getElementById('question-data').textContent);
    const STORAGE_KEY = 'it-recht-113-pdf-only-no-restart-v1';
    const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

    const el = {
      question: document.getElementById('question'),
      choices: document.getElementById('choices'),
      form: document.getElementById('quizForm'),
      checkBtn: document.getElementById('checkBtn'),
      nextBtn: document.getElementById('nextBtn'),
      status: document.getElementById('status'),
      progressBar: document.getElementById('progressBar'),
      scorePill: document.getElementById('scorePill'),
      missedPill: document.getElementById('missedPill'),
      feedback: document.getElementById('feedback'),
      hint: document.getElementById('hint')
    };

    let state = {
      questions: [],
      idx: 0,
      score: 0,
      missed: [],
      checked: false,
      selected: []
    };

    function shuffleArray(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function prepareQuestions(list) {
      return shuffleArray(list).map((q) => ({
        ...q,
        choices: shuffleArray(q.choices || [])
      }));
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
    }

    function loadSavedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.questions) || !parsed.questions.length) return null;
        // Do not restore an old/incompatible session if the source size changed.
        if (parsed.questions.length !== SOURCE_QUESTIONS.length) return null;
        return parsed;
      } catch (_) {
        return null;
      }
    }

    function startNewSession(questionList = SOURCE_QUESTIONS) {
      state = {
        questions: prepareQuestions(questionList),
        idx: 0,
        score: 0,
        missed: [],
        checked: false,
        selected: []
      };
      saveState();
      renderQuestion();
    }

    function currentQuestion() { return state.questions[state.idx]; }

    function correctIndices(q) {
      return (q.choices || []).reduce((out, c, i) => { if (c.isCorrect) out.push(i); return out; }, []);
    }

    function equalAsSets(a, b) {
      if (a.length !== b.length) return false;
      const set = new Set(b);
      return a.every(x => set.has(x));
    }

    function selectedIndices() {
      return [...el.form.querySelectorAll('input[name="choice"]:checked')].map(n => Number(n.value));
    }

    function setDisabledAll(value) {
      el.form.querySelectorAll('input[name="choice"]').forEach(n => n.disabled = value);
    }

    function updateTopStats() {
      el.scorePill.textContent = String(state.score);
      el.missedPill.textContent = String(state.missed.length);
      const total = state.questions.length || SOURCE_QUESTIONS.length;
      const done = Math.min(state.idx, total - 1);
      const pct = total ? Math.round((done / total) * 100) : 0;
      el.progressBar.style.width = `${pct}%`;
    }

    function syncSelectedClasses() {
      [...el.form.querySelectorAll('.choice')].forEach((wrap) => {
        const cb = wrap.querySelector('input[type="checkbox"]');
        wrap.classList.toggle('selected', !!cb?.checked);
      });
    }

    function clearChoiceState() {
      [...el.form.querySelectorAll('.choice')].forEach((wrap) => {
        wrap.classList.remove('selected', 'correct', 'incorrect', 'missed');
      });
    }

    function renderQuestion() {
      const q = currentQuestion();
      if (!q) return showResults();

      el.question.textContent = q.question;
      el.hint.textContent = 'Select all correct answers.';
      el.choices.innerHTML = '';
      el.feedback.className = 'feedback';
      el.feedback.textContent = '';

      q.choices.forEach((choice, i) => {
        const id = `choice-${state.idx}-${i}`;
        const wrap = document.createElement('div');
        wrap.className = 'choice';

        const input = document.createElement('input');
        input.type = 'checkbox';
        input.name = 'choice';
        input.id = id;
        input.value = String(i);
        input.checked = state.selected.includes(i);
        input.disabled = state.checked;

        const label = document.createElement('label');
        label.setAttribute('for', id);

        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = LETTERS[i] || String(i + 1);

        const content = document.createElement('span');
        content.className = 'text';
        content.textContent = choice.text;

        label.appendChild(badge);
        label.appendChild(content);
        wrap.appendChild(input);
        wrap.appendChild(label);
        el.choices.appendChild(wrap);
      });

      el.checkBtn.hidden = state.checked;
      el.nextBtn.hidden = !state.checked;
      el.checkBtn.disabled = state.selected.length === 0;
      el.nextBtn.textContent = state.idx + 1 === state.questions.length ? 'Show results' : 'Next';

      const pct = Math.floor((state.idx / state.questions.length) * 100);
      el.status.textContent = `(${q.id}) Question ${state.idx + 1} of ${state.questions.length} — ${pct}% done`;
      updateTopStats();
      syncSelectedClasses();

      if (state.checked) revealAnswerState();
    }

    function revealAnswerState() {
      const q = currentQuestion();
      const selected = state.selected;
      const correct = correctIndices(q);
      const choiceEls = [...el.form.querySelectorAll('.choice')];
      clearChoiceState();

      selected.forEach(i => {
        if (correct.includes(i)) choiceEls[i]?.classList.add('correct');
        else choiceEls[i]?.classList.add('incorrect');
      });
      correct.forEach(i => {
        if (!selected.includes(i)) choiceEls[i]?.classList.add('missed');
        choiceEls[i]?.classList.add('correct');
      });

      const exact = equalAsSets(selected, correct);
      el.feedback.className = `feedback show ${exact ? 'ok' : 'bad'}`;
      el.feedback.innerHTML = exact
        ? 'Correct. Nice work.'
        : `Not quite. Correct answers are: <strong>${correct.map(i => LETTERS[i] || i + 1).join(', ')}</strong>.`;
    }

    function onSelectionChanged() {
      if (state.checked) return;
      state.selected = selectedIndices();
      el.checkBtn.disabled = state.selected.length === 0;
      syncSelectedClasses();
      saveState();
    }

    function checkAnswers() {
      const q = currentQuestion();
      if (!q || state.checked) return;
      const selected = selectedIndices();
      if (!selected.length) return;

      state.selected = selected;
      const exact = equalAsSets(selected, correctIndices(q));
      state.checked = true;
      if (exact) {
        state.score += 1;
        el.nextBtn.classList.add('success');
      } else {
        if (!state.missed.some(m => m.id === q.id)) {
          state.missed.push({ id: q.id, question: q.question });
        }
        el.nextBtn.classList.remove('success');
      }

      setDisabledAll(true);
      el.checkBtn.hidden = true;
      el.nextBtn.hidden = false;
      revealAnswerState();
      updateTopStats();
      saveState();
      el.nextBtn.focus?.();
    }

    function nextQuestion() {
      if (state.idx + 1 < state.questions.length) {
        state.idx += 1;
        state.checked = false;
        state.selected = [];
        saveState();
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      const total = state.questions.length;
      const percent = total ? Math.round((state.score / total) * 100) : 0;
      el.progressBar.style.width = '100%';
      el.status.textContent = 'Quiz finished — 100% done';
      el.question.textContent = 'Results';
      el.hint.textContent = 'Your 113-question PDF quiz session is complete.';
      el.feedback.className = 'feedback';
      el.feedback.textContent = '';
      el.checkBtn.hidden = true;
      el.nextBtn.hidden = true;

      const missedHtml = state.missed.length
        ? `<div class="missed-list">${state.missed.map(m => `<div class="missed-item"><b>${escapeHtml(m.id)}</b> — ${escapeHtml(m.question)}</div>`).join('')}</div>`
        : '<div class="missed-item" style="text-align:center;">No missed questions 🎉</div>';

      el.choices.innerHTML = `
        <div class="results">
          <div class="score-big">${percent}%</div>
          <div class="result-grid">
            <div class="metric"><strong>${state.score}</strong><span>correct</span></div>
            <div class="metric"><strong>${total}</strong><span>questions</span></div>
            <div class="metric"><strong>${state.missed.length}</strong><span>missed</span></div>
          </div>
          <div>${missedHtml}</div>
          <p class="hint" style="margin-top:14px;">Refresh the page after finishing to start a new shuffled run.</p>
          <div class="toolbar">
            ${state.missed.length ? '<button type="button" class="mini" id="retryMissedBtn">Retry missed only</button>' : ''}
            ${state.missed.length ? '<button type="button" class="mini" id="copyMissedBtn">Copy missed IDs</button>' : ''}
          </div>
        </div>
      `;

      document.getElementById('retryMissedBtn')?.addEventListener('click', retryMissedOnly);
      document.getElementById('copyMissedBtn')?.addEventListener('click', copyMissedIds);
      try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
    }

    function retryMissedOnly() {
      const missedIds = new Set(state.missed.map(m => m.id));
      const missedQuestions = state.questions.filter(q => missedIds.has(q.id));
      if (!missedQuestions.length) return;
      state = {
        questions: prepareQuestions(missedQuestions.map(q => ({ ...q, choices: q.choices.slice() }))),
        idx: 0,
        score: 0,
        missed: [],
        checked: false,
        selected: []
      };
      saveState();
      renderQuestion();
    }

    async function copyMissedIds() {
      const text = state.missed.map(m => m.id).join(', ');
      try {
        await navigator.clipboard.writeText(text);
        el.status.textContent = 'Missed IDs copied.';
      } catch (_) {
        el.status.textContent = `Missed IDs: ${text}`;
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    el.form.addEventListener('change', onSelectionChanged);
    el.checkBtn.addEventListener('click', checkAnswers);
    el.nextBtn.addEventListener('click', nextQuestion);

    document.addEventListener('keydown', (event) => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;

      if (/^[1-9]$/.test(event.key) && !state.checked) {
        const n = Number(event.key) - 1;
        const input = el.form.querySelector(`input[name="choice"][value="${n}"]`);
        if (input) {
          input.checked = !input.checked;
          input.dispatchEvent(new Event('change', { bubbles: true }));
          event.preventDefault();
        }
      }

      if (event.key === 'Enter') {
        if (!el.checkBtn.hidden && !el.checkBtn.disabled) { checkAnswers(); event.preventDefault(); }
        else if (!el.nextBtn.hidden) { nextQuestion(); event.preventDefault(); }
      }
    });

    (function init() {
      const saved = loadSavedState();
      if (saved && saved.idx < saved.questions.length) {
        state = saved;
        renderQuestion();
      } else {
        startNewSession();
      }
    })();
  </script>
</body>
</html>
